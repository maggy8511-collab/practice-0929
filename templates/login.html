{% extends "base.html" %}
{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                    <i class="bi bi-shield-lock-fill fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1">管理員登入</h4>
                <p class="text-muted small">請輸入帳號密碼以管理訂單系統</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold small" for="username">管理員帳號</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" value="admin" required autofocus>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold small" for="password">密碼</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" value="admin123" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2">
                    <i class="bi bi-box-arrow-in-right me-1"></i> 立即登入
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center text-muted small">
                <p class="mb-1"><strong>預設管理員帳密：</strong></p>
                <code>帳號: admin</code> | <code>密碼: admin123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
